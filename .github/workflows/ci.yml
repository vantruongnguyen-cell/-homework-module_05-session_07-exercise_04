name: Restaurant Service CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: [self-hosted, quickbite, restaurant-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          sed -i 's/\r$//' gradlew
          sh gradlew bootJar